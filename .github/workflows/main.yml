name: Publish to CurseForge and Modrinth

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Publish to CurseForge and Modrinth
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: build/libs/!(*-@(dev|sources|javadoc)).jar

          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          version: ${{ github.event.release.tag_name }}
          version-type: beta

          loaders: neoforge
          game-versions: 1.21.1
          environment: client | server
          java: Java 21

          dependencies: |
            touhou_little_maid(required){modrinth:touhou-little-maid}{curseforge:355044}
            kaleidoscope_cookery(optional){modrinth:kaleidoscope-cookery}{curseforge:1309203}

          retry-attempts: 2
          retry-delay: 10000
          fail-mode: fail
